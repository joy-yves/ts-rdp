name: ts-rdp

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "minutes alive (max 350)"
        required: true
        default: "350"
      rdp_password:
        description: "windows rdp password"
        required: true
      ts_authkey:
        description: "optional tailscale auth key; leave empty for interactive login"
        required: false
      nvidia_api_key:
        description: "nvidia nim api key for opencode"
        required: true

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Enable RDP and create user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ github.event.inputs.rdp_password }}
        run: |
          $ErrorActionPreference = "Stop"
          $u = "rdp"; $p = $env:RDP_PASSWORD
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password (ConvertTo-SecureString $p -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $u -Password (ConvertTo-SecureString $p -AsPlainText -Force)
          }
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP 3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          Set-Service TermService -StartupType Automatic
          Start-Service TermService
          Write-Host "rdp user ready"

      - name: Install and configure OpenCode
        shell: pwsh
        env:
          NVIDIA_API_KEY: ${{ github.event.inputs.nvidia_api_key }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:NVIDIA_API_KEY) { throw "NVIDIA_API_KEY input is empty" }
          $prefix = "C:\ProgramData\opencode"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          & npm install -g --prefix $prefix "@opencode/cli"
          if ($LASTEXITCODE -ne 0) { throw "npm install failed $LASTEXITCODE" }
          $exe = Join-Path $prefix "opencode.cmd"
          if (-not (Test-Path $exe)) { throw "opencode.cmd missing at $exe" }

          $cfgDir = "C:\Users\rdp\.config\opencode"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          $cfg = [ordered]@{
            '$schema' = "https://opencode.ai/config.json"
            model = "nvidia/nemotron-3-ultra-550b-a55b"
            providers = [ordered]@{
              nvidia = [ordered]@{
                name = "NVIDIA NIM"
                env = @("NVIDIA_API_KEY")
                package = "@opencode/ai/providers/openai-compatible"
                settings = [ordered]@{
                  baseURL = "https://integrate.api.nvidia.com/v1"
                  apiKey = "{env:NVIDIA_API_KEY}"
                }
                models = [ordered]@{
                  "nemotron-3-ultra-550b-a55b" = [ordered]@{
                    name = "Nemotron 3 Ultra 550B A55B"
                    modelID = "nvidia/nemotron-3-ultra-550b-a55b"
                    settings = [ordered]@{ reasoningEffort = "high" }
                    body = [ordered]@{ reasoning_effort = "high" }
                    capabilities = [ordered]@{
                      reasoning = [ordered]@{ supported = $true; effort = @("none", "medium", "high") }
                    }
                    variants = @(
                      [ordered]@{ id = "high"; settings = [ordered]@{ reasoningEffort = "high" }; body = [ordered]@{ reasoning_effort = "high" } }
                      [ordered]@{ id = "medium"; settings = [ordered]@{ reasoningEffort = "medium" }; body = [ordered]@{ reasoning_effort = "medium" } }
                      [ordered]@{ id = "none"; settings = [ordered]@{ reasoningEffort = "none" }; body = [ordered]@{ reasoning_effort = "none" } }
                    )
                  }
                }
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $cfgDir "opencode.json") -Encoding UTF8

          $launcher = @(
            "@echo off"
            "set `"NVIDIA_API_KEY=$env:NVIDIA_API_KEY`""
            "cd /d C:\Users\rdp"
            "`"$exe`""
          ) -join "`r`n"
          Set-Content -LiteralPath "C:\Users\Public\Desktop\OpenCode.cmd" -Value $launcher -Encoding ASCII
          $startup = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\OpenCode.cmd"
          New-Item -ItemType Directory -Force -Path (Split-Path $startup) | Out-Null
          Set-Content -LiteralPath $startup -Value $launcher -Encoding ASCII
          Write-Host "opencode ready: $exe"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI failed $($p.ExitCode)" }
          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) { throw "tailscale.exe missing" }
          Write-Host "tailscale installed"

      - name: Join tailnet
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ github.event.inputs.ts_authkey }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "ghrdp-$env:GITHUB_RUN_ID"
          function Set-Status([hashtable]$obj) {
            $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/status-${env:GITHUB_RUN_ID}.json"
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($obj | ConvertTo-Json -Compress)))
            $headers = @{ Authorization = "token $env:GH_TOKEN"; "User-Agent" = "ci"; Accept = "application/vnd.github+json" }
            $sha = $null
            try { $cur = Invoke-RestMethod -Uri $api -Headers $headers; $sha = $cur.sha } catch {}
            $body = @{ message = "status"; content = $b64; branch = "main" }
            if ($sha) { $body.sha = $sha }
            try { Invoke-RestMethod -Uri $api -Method Put -Headers $headers -Body ($body | ConvertTo-Json -Depth 5) -ContentType "application/json" | Out-Null } catch { Write-Host "status update failed: $($_.Exception.Message)" }
          }
          $svc = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne "Running") { Start-Service Tailscale; Start-Sleep -Seconds 5 }
          Write-Host ("svc=" + (Get-Service Tailscale -ErrorAction SilentlyContinue).Status)
          Write-Host ("ver=" + ((& $ts version 2>&1 | Out-String).Trim()))
          $out = Join-Path $env:RUNNER_TEMP "ts.out"
          $err = Join-Path $env:RUNNER_TEMP "ts.err"
          Remove-Item $out, $err -ErrorAction SilentlyContinue
          $upArgs = @("up","--hostname",$hostname)
          if ($env:TS_AUTHKEY) { $upArgs += @("--auth-key",$env:TS_AUTHKEY) }
          $p = Start-Process -FilePath $ts -ArgumentList $upArgs -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow
          $url = $null; $ip = ""
          $deadline = (Get-Date).AddMinutes(20)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $txt = ""
            if (Test-Path $out) { $txt += (Get-Content $out -Raw -ErrorAction SilentlyContinue) }
            if (Test-Path $err) { $txt += (Get-Content $err -Raw -ErrorAction SilentlyContinue) }
            if (-not $url -and $txt -match 'https://login\.tailscale\.com/a/[A-Za-z0-9]+') {
              $url = $matches[0]
              Write-Host "TS_LOGIN=$url"
              Write-Host "::notice title=Tailscale login::$url"
              Set-Status @{ status = "waiting_login"; login = $url; host = $hostname; run_id = $env:GITHUB_RUN_ID }
            }
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($ip) { break }
            if ($p.HasExited -and -not $url) {
              Write-Host "--- tailscale up stdout/stderr ---"
              Write-Host $txt
              throw "tailscale up exited without a login url"
            }
            if ($p.HasExited -and $url) {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ip) {
            Write-Host "--- tailscale up stdout/stderr ---"
            if (Test-Path $out) { Write-Host (Get-Content $out -Raw -ErrorAction SilentlyContinue) }
            if (Test-Path $err) { Write-Host (Get-Content $err -Raw -ErrorAction SilentlyContinue) }
            Set-Status @{ status = "failed"; host = $hostname; run_id = $env:GITHUB_RUN_ID }
            throw "tailscale did not come up"
          }
          $ip = $ip.Trim()
          if (-not $p.HasExited) { $p.WaitForExit(15000) | Out-Null }
          $self = ""
          try { $self = ((& $ts status --json 2>$null | Out-String | ConvertFrom-Json).Self.DNSName) } catch {}
          Write-Host "TS_IP=$ip"
          Write-Host "TS_HOST=$hostname"
          Write-Host "TS_SELF=$self"
          Set-Status @{ status = "ready"; ip = $ip; host = $hostname; self = $self; user = "rdp"; port = 3389; run_id = $env:GITHUB_RUN_ID; opencode = "ready"; model = "nvidia/nemotron-3-ultra-550b-a55b"; variant = "high" }
          exit 0

      - name: Keep alive
        shell: pwsh
        env:
          DURATION: ${{ github.event.inputs.duration_minutes }}
        run: |
          $deadline = (Get-Date).AddMinutes([int]$env:DURATION)
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            & $ts status | Out-Null
          }
